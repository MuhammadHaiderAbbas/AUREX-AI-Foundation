# AUREX AI — local development stack.
#   docker compose up --build          -> http://localhost:8080
#   docker compose exec backend python -m app.cli create-admin --email you@example.com
name: aurex

services:
  db:
    image: pgvector/pgvector:pg16   # pgvector is used from Phase 4 (research RAG)
    environment:
      POSTGRES_USER: aurex
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-aurex}
      POSTGRES_DB: aurex
    volumes: [pgdata:/var/lib/postgresql/data]
    ports: ["127.0.0.1:5432:5432"]
    security_opt: ["no-new-privileges:true"]
    networks: [internal]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U aurex -d aurex"]
      interval: 5s
      timeout: 3s
      retries: 20

  redis:
    image: redis:7.4-alpine         # cache + streams from Phase 3 (market data)
    command: ["redis-server", "--appendonly", "yes"]
    volumes: [redisdata:/data]
    ports: ["127.0.0.1:6379:6379"]
    security_opt: ["no-new-privileges:true"]
    networks: [internal]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  backend:
    build: ./backend
    env_file: [{ path: .env, required: false }]
    environment:
      AUREX_DATABASE_URL: postgresql+asyncpg://aurex:${POSTGRES_PASSWORD:-aurex}@db:5432/aurex
      AUREX_CORS_ORIGINS: http://localhost:8080
      FORWARDED_ALLOW_IPS: 172.28.0.10          # the web (Caddy) container only
    depends_on:
      db: { condition: service_healthy }
      redis: { condition: service_healthy }
    ports: ["127.0.0.1:8000:8000"]
    read_only: true
    tmpfs: [/tmp]
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    networks: [internal]

  web:
    build: ./frontend
    environment:
      AUREX_SITE_ADDRESS: ":80"
      AUREX_API_UPSTREAM: backend:8000
    depends_on:
      backend: { condition: service_healthy }
    ports: ["127.0.0.1:8080:80"]
    read_only: true
    tmpfs: [/tmp, /data, /config]
    cap_drop: [ALL]
    cap_add: [NET_BIND_SERVICE]
    security_opt: ["no-new-privileges:true"]
    networks:
      internal: { ipv4_address: 172.28.0.10 }

networks:
  internal:
    ipam:
      config: [{ subnet: 172.28.0.0/24 }]

volumes:
  pgdata:
  redisdata:
