name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env: { POSTGRES_USER: aurex, POSTGRES_PASSWORD: aurex, POSTGRES_DB: aurex_test }
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U aurex" --health-interval 5s --health-timeout 3s --health-retries 20
      redis:                         # shared rate-limit tests (tests/test_ops.py)
        image: redis:7.4-alpine
        ports: ["6379:6379"]
    defaults: { run: { working-directory: backend } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.13", cache: pip, cache-dependency-path: backend/requirements*.txt }
      - run: pip install -r requirements-dev.txt
      - run: ruff check .
      - run: pytest -q
        env:
          AUREX_DATABASE_URL: postgresql+asyncpg://aurex:aurex@localhost:5432/aurex_test

  frontend:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: frontend } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm, cache-dependency-path: frontend/package-lock.json }
      - run: npm ci
      - run: npm run build

  e2e:
    needs: [backend, frontend]
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env: { POSTGRES_USER: aurex, POSTGRES_PASSWORD: aurex, POSTGRES_DB: aurex }
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U aurex" --health-interval 5s --health-timeout 3s --health-retries 20
    env:
      AUREX_DATABASE_URL: postgresql+asyncpg://aurex:aurex@localhost:5432/aurex
      AUREX_ADMIN_PASSWORD: Ci-Operator-Key-42!
      AUREX_E2E_ADMIN_EMAIL: admin@example.com
      AUREX_E2E_ADMIN_PASSWORD: Ci-Operator-Key-42!
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.13", cache: pip, cache-dependency-path: backend/requirements*.txt }
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm, cache-dependency-path: frontend/package-lock.json }
      - name: Start API
        working-directory: backend
        run: |
          pip install -r requirements.txt
          alembic upgrade head
          python -m app.cli create-admin --email "$AUREX_E2E_ADMIN_EMAIL" --name "CI Admin"
          nohup uvicorn app.main:app --port 8000 > api.log 2>&1 &
      - name: Playwright
        working-directory: frontend
        run: |
          npm ci
          npx playwright install --with-deps chromium
          npx playwright test --trace off

  ops:
    name: Backup and restore drill
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env: { POSTGRES_USER: aurex, POSTGRES_PASSWORD: aurex, POSTGRES_DB: aurex }
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U aurex" --health-interval 5s --health-timeout 3s --health-retries 20
    defaults: { run: { working-directory: backend } }
    env:
      AUREX_DATABASE_URL: postgresql+asyncpg://aurex:aurex@localhost:5432/aurex
      DATABASE_URL: postgresql://aurex:aurex@localhost:5432/aurex
      AUREX_AUDIT_ANCHOR_FILE: /tmp/anchors/aurex.jsonl
      AUREX_CLI: python -m app.cli
      BACKUP_DIR: /tmp/backups
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.13", cache: pip, cache-dependency-path: backend/requirements*.txt }
      - run: pip install -r requirements.txt
      - name: Postgres client matches the server major version (16), from the PGDG repository
        run: |
          sudo install -d /usr/share/postgresql-common/pgdg
          sudo curl -fsSL -o /usr/share/postgresql-common/pgdg/apt.postgresql.org.asc https://www.postgresql.org/media/keys/ACCC4CF8.asc
          echo "deb [signed-by=/usr/share/postgresql-common/pgdg/apt.postgresql.org.asc] https://apt.postgresql.org/pub/repos/apt $(lsb_release -cs)-pgdg main" | sudo tee /etc/apt/sources.list.d/pgdg.list
          sudo apt-get update -qq && sudo apt-get install -y -qq postgresql-client-16 >/dev/null
          echo "/usr/lib/postgresql/16/bin" >> "$GITHUB_PATH"
          /usr/lib/postgresql/16/bin/pg_dump --version
      - name: Schema and some audited activity
        run: |
          alembic upgrade head
          AUREX_ADMIN_PASSWORD='Ci-Operator-Key-42!' python -m app.cli create-admin --email ops@example.com --name "CI Ops"
          python -m app.cli audit-anchor
      - name: Backup
        run: ops/backup/backup.sh
      - name: Restore drill (restore into a scratch database + integrity checks)
        run: ops/backup/restore-drill.sh
      - name: Live database still intact and anchors verify
        run: |
          python -m app.cli integrity-check
          python -m app.cli audit-verify-anchors "$AUREX_AUDIT_ANCHOR_FILE"
          test "$(psql "$DATABASE_URL" -Atc "select value->>'ok' from system_controls where key='last_restore_drill'")" = "true"
      - name: Refuses to restore without confirmation
        run: |
          ! ops/backup/restore.sh "$(ls -1 $BACKUP_DIR/aurex-*.dump | head -1)"

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build images
        run: |
          docker build -t aurex-backend ./backend
          docker build --target ops -t aurex-ops ./backend
          docker build -t aurex-web ./frontend
      - name: Smoke-test backend image (ML stack incl. LightGBM/OpenMP)
        run: |
          docker run --entrypoint python aurex-backend -c "
          import numpy as np, app.main
          from app.ml.models import make_model
          X = np.random.rand(200, 14); m = make_model('lightgbm'); m.fit(X, (X[:, 0] > 0.5).astype(int))
          print('backend image ok', m.predict_proba(X[:2]).shape)"
