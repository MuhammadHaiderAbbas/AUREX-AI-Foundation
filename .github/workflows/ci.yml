name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env: { POSTGRES_USER: aurex, POSTGRES_PASSWORD: aurex, POSTGRES_DB: aurex_test }
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U aurex" --health-interval 5s --health-timeout 3s --health-retries 20
    defaults: { run: { working-directory: backend } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.13", cache: pip, cache-dependency-path: backend/requirements*.txt }
      - run: pip install -r requirements-dev.txt
      - run: ruff check .
      - run: pytest -q
        env:
          AUREX_DATABASE_URL: postgresql+asyncpg://aurex:aurex@localhost:5432/aurex_test

  frontend:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: frontend } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm, cache-dependency-path: frontend/package-lock.json }
      - run: npm ci
      - run: npm run build

  e2e:
    needs: [backend, frontend]
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env: { POSTGRES_USER: aurex, POSTGRES_PASSWORD: aurex, POSTGRES_DB: aurex }
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U aurex" --health-interval 5s --health-timeout 3s --health-retries 20
    env:
      AUREX_DATABASE_URL: postgresql+asyncpg://aurex:aurex@localhost:5432/aurex
      AUREX_ADMIN_PASSWORD: Ci-Admin-Passw0rd!
      AUREX_E2E_ADMIN_EMAIL: admin@example.com
      AUREX_E2E_ADMIN_PASSWORD: Ci-Admin-Passw0rd!
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.13", cache: pip, cache-dependency-path: backend/requirements*.txt }
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm, cache-dependency-path: frontend/package-lock.json }
      - name: Start API
        working-directory: backend
        run: |
          pip install -r requirements.txt
          alembic upgrade head
          python -m app.cli create-admin --email "$AUREX_E2E_ADMIN_EMAIL" --name "CI Admin"
          nohup uvicorn app.main:app --port 8000 > api.log 2>&1 &
      - name: Playwright
        working-directory: frontend
        run: |
          npm ci
          npx playwright install --with-deps chromium
          npx playwright test --trace off
