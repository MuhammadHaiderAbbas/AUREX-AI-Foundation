[project]
name = "aurex-backend"
version = "0.1.0"
description = "AUREX AI backend — modular monolith (FastAPI)"
requires-python = ">=3.12"

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
filterwarnings = ["ignore::DeprecationWarning"]

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S", "ASYNC"]
ignore = ["B008", "S101", "B904", "UP046"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S105", "S106", "E501"]
"alembic/*" = ["E501"]
"app/research/text.py" = ["E501"]
"app/research/samples.py" = ["E501"]
"app/agents/specialists.py" = ["E501"]
"app/ml/*" = ["E501"]
"app/backtest/*" = ["E501"]
"app/trading/*" = ["E501"]
"app/risk/*" = ["E501"]
"app/analytics/*" = ["E501"]
"app/ops/*" = ["E501"]
"app/api/v1/ops.py" = ["E501"]
"app/cli.py" = ["E501"]
"app/api/v1/analytics.py" = ["E501"]
"app/models/risk.py" = ["E501"]
"app/binary/*" = ["E501"]
"app/api/v1/binary.py" = ["E501"]
"app/api/v1/risk.py" = ["E501"]
"app/api/v1/trading.py" = ["E501"]

[tool.ruff.lint.isort]
known-third-party = ["alembic"]
known-first-party = ["app", "tests"]
